services:
  identifier:
    build: ../../
    env_file:
      - .test-identifier-env
  tests:
    build:
      context: infrastructure
      dockerfile: Dockerfile.tests
    working_dir: /tests
    volumes:
      - ./cases:/tests/cases
    networks:
      default:
        aliases:
          - dispatcher
    command: >
      sh -c "npx mocha --file setup.js
      $${TEST_SPEC:-cases/*.js} --timeout 15000 --exit"

  project-scripts:
    image: semtech/mu-scripts:1.0.0
    volumes:
      - ./scripts/project-scripts/:/app/scripts/
    restart: "no"
