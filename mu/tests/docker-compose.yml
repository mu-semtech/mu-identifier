services:
  identifier:
    build: ../../
    env_file:
      - .test-identifier-env
  mocha:
    build:
      context: infrastructure
      dockerfile: Dockerfile.tests
    working_dir: /tests
    volumes:
      - ./cases:/tests/cases
      - ./.tmp/results:/results
    networks:
      default:
        aliases:
          - dispatcher
    command: >
      sh -c "npx mocha --file setup.js
      $${TEST_SPEC:-cases/*.js} --timeout 15000 --exit
      --reporter /tests/summary-reporter.cjs"

  tests:
    image: semtech/mu-scripts:1.0.0
    volumes:
      - ./scripts/project-scripts/:/app/scripts/
    restart: "no"
